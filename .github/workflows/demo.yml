
name: Deploy website

on:
  push:
    branches:
      - master

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Get code
        uses: actions/checkout@v7
      - name: Cache
        uses: actions/cache@v3
        with:
          path: ~/.npm
          key: key-${{hashFiles('**/package-lock.json')}}
      - name: Install dependencies
        run: npm ci

      - name: Lint code
        run: npm run lint

      - name: Test code
        run: npm run test

  build:
    needs: test
    runs-on: ubuntu-latest
    outputs:
      file-name: $ {{steps.s4.outputs.file-names}}
    steps:
      - name: Get code
        uses: actions/checkout@v7
      - name: Cache
        uses: actions/cache@v3
        with:
          path: ~/.npm
          key: key-${{hashFiles('**/package-lock.json')}}
      - name: Install dependencies
        run: npm ci

      - name: Build website
        run: npm run build

      - name: Save Job Artifact
        uses: actions/upload-artifact@v7
        with:
          name: dist-file
          path: dist
      - name : job output of file js file name
        id: s4
        run: echo "file-names=$(find dist -type f -name '*.js' | xargs basename)" >> $GITHUB_OUTPUT
  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v8
        with:
          name: dist-file
          path: dist
      - name: build output
        run: echo "Build output file names ${{ needs.build.outputs.file-name }}"
      - name: Output contents
        run: ls -R dist
